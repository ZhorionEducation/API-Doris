paths:
  /api/roles:
    get:
      tags:
        - Roles
      summary: Obtener roles
      operationId: getAllRoles
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Lista paginada obtenida correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          description: Parámetros de paginación inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error al obtener los roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Roles
      summary: Registrar un rol
      operationId: registerRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRole'
      responses:
        '201':
          description: Rol registrado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMutationResult'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El código o nombre ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error al registrar el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/roles/{codigo}:
    get:
      tags:
        - Roles
      summary: Obtener un rol por código
      operationId: getRoleByCode
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Rol encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Código inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El rol no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error al obtener el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Roles
      summary: Actualizar un rol
      operationId: updateRole
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRole'
      responses:
        '200':
          description: Rol actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMutationResult'
        '400':
          description: Código o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El rol no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El nombre ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error al actualizar el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Roles
      summary: Desactivar un rol
      description: Cambia el estado a Inactivo; no elimina el registro.
      operationId: deactivateRole
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Rol desactivado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMutationResult'
        '400':
          description: Código inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El rol no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error al desactivar el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CreateRole:
      type: object
      required:
        - codigo
        - nombre
      properties:
        codigo:
          type: string
          maxLength: 20
          example: EST
        nombre:
          type: string
          maxLength: 60
          example: Estudiante
        descripcion:
          type: string
          maxLength: 255
          nullable: true
          example: Usuario con rol de estudiante
        estado:
          type: string
          enum:
            - Activo
            - Inactivo
          default: Activo
          example: Activo

    UpdateRole:
      type: object
      required:
        - nombre
        - estado
      properties:
        nombre:
          type: string
          maxLength: 60
          example: Estudiante
        descripcion:
          type: string
          maxLength: 255
          nullable: true
          example: Usuario con rol de estudiante
        estado:
          type: string
          enum:
            - Activo
            - Inactivo
          example: Activo

    Role:
      type: object
      properties:
        codigo:
          type: string
          example: EST
        nombre:
          type: string
          example: Estudiante
        descripcion:
          type: string
          nullable: true
          example: Usuario con rol de estudiante
        estado:
          type: string
          enum:
            - Activo
            - Inactivo
          example: Activo

    RolePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RoleMutationResult:
      type: object
      properties:
        affectedRows:
          type: integer
          example: 1
        insertId:
          type: integer
          example: 0
        changedRows:
          type: integer
          example: 0